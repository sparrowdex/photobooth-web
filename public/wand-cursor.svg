<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36" fill="none">
  <defs>
    <linearGradient id="wandStick" x1="4" y1="32" x2="26" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#db2777" />
      <stop offset="40%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.2" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Wand Stick -->
  <line x1="5" y1="31" x2="25" y2="11" stroke="url(#wandStick)" stroke-width="3" stroke-linecap="round" />
  <line x1="6" y1="30" x2="24" y2="12" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.8" />
  
  <!-- Glowing Magical Star Tip -->
  <g transform="translate(25, 11)" filter="url(#starGlow)">
    <path d="M 0 -8 C 0.5 -2.5 2.5 -0.5 8 0 C 2.5 0.5 0.5 2.5 0 8 C -0.5 2.5 -2.5 0.5 -8 0 C -2.5 -0.5 -0.5 -2.5 0 -8 Z" fill="#fdf2f8" stroke="#f472b6" stroke-width="0.8" />
    <circle cx="0" cy="0" r="2.2" fill="#ffffff" />
  </g>

  <!-- Little Sparkle Accents -->
  <circle cx="30" cy="4" r="1.2" fill="#ffffff" opacity="0.95" />
  <circle cx="33" cy="14" r="0.9" fill="#f472b6" opacity="0.9" />
  <circle cx="16" cy="18" r="0.8" fill="#ffffff" opacity="0.8" />
</svg>
